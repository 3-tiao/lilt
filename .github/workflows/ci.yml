name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Swift build
        working-directory: player
        run: swift build
      - name: Swift deterministic tests
        working-directory: player
        run: swift test
      - name: Xcode app builds (unsigned)
        env:
          LILT_BUILD_UNSIGNED: "1"
        run: |
          brew install xcodegen
          cd player && xcodegen generate && ./scripts/build-app.sh
      - name: Whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              git diff --check "${BASE_SHA}...${HEAD_SHA}"
            else
              git diff --check "${BASE_SHA}..${HEAD_SHA}"
            fi
          else
            git diff-tree --check --root "${HEAD_SHA}"
          fi
