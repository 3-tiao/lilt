# OPTIONAL, NOT ACTIVE.
#
# This workflow is intentionally kept outside .github/workflows so it does not
# run automatically. Releases currently happen locally (see
# docs/product/release.md). If releases become frequent, copy this file to
# .github/workflows/release.yml and configure the repository secrets listed in
# that doc.
#
name: Release

# Pushing a v* tag builds the signed+notarized helper, packages the release
# tarball, publishes it on GitHub Releases, and updates the Homebrew formula in
# 3-tiao/homebrew-lilt. See docs/product/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain=build.keychain
          security create-keychain -p actions "$keychain"
          existing=$(security list-keychains -d user | tr -d ' "')
          security list-keychains -d user -s ${existing} "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p actions "$keychain"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 -D > cert.p12
          security import cert.p12 -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          rm cert.p12
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$identity"
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"

      - name: Configure notarization
        if: ${{ secrets.NOTARY_APPLE_ID != '' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials lilt-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=lilt-notary" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: just release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=("dist/lilt-${tag}-darwin-arm64.tar.gz" "dist/lilt-${tag}-darwin-arm64.tar.gz.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi

      - name: Update Homebrew formula
        if: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          sha=$(shasum -a 256 "dist/lilt-${tag}-darwin-arm64.tar.gz" | awk '{print $1}')
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/3-tiao/homebrew-lilt.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/lilt.rb tap/Formula/lilt.rb
          sed -i '' -E "s/^  version \".*\"/  version \"${version}\"/" tap/Formula/lilt.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" tap/Formula/lilt.rb
          cd tap
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "lilt release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "lilt ${version}"
          git push
