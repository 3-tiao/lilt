name: LiltPlayer
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9Y6KG228YM
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: 5.0
targets:
  LiltPlayerLogic:
    type: framework
    platform: macOS
    sources:
      - path: Sources/LiltPlayerLogic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caiguo.lilt-player.logic
        PRODUCT_NAME: LiltPlayerLogic
  LiltHelperKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/LiltHelperKit
    dependencies:
      - target: LiltPlayerLogic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caiguo.lilt-helper-kit
        PRODUCT_NAME: LiltHelperKit
  LiltPlayer:
    type: application
    platform: macOS
    sources:
      - path: Sources/LiltPlayer
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: LiltPlayerLogic
      - target: LiltHelperKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.caiguo.lilt-player
        PRODUCT_NAME: lilt-player
  LiltAudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/LiltAudio
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: LiltPlayerLogic
      - target: LiltHelperKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/AudioInfo.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.caiguo.lilt-audio
        PRODUCT_NAME: lilt-audio
